    <span style="font-family: 'IBM Plex Mono', monospace; font-size: 22px; font-weight: 600">00:31.7</span>
    <div style="display: flex; gap: 12px">
      <div style="display: flex; flex-direction: column; gap: 3px; width: 82px">
        <span style="font-family: 'IBM Plex Mono', monospace; font-size: 9px; letter-spacing: 1px; color: #9AA3AE">BATTERY 54%</span>

      <div style="display: flex; flex-direction: column; gap: 3px; width: 82px">

      <span style="font-family: 'IBM Plex Mono', monospace; font-size: 11px; color: #9AA3AE">JEV · 341 ms · trigger: submerged</span>
    </div>
    <div style="display: flex; flex-wrap: wrap; gap: 6px">
      <span style="padding: 4px 8px; border-radius: 7px; border: 1px solid #1F5A63; background: #0C1A1D; color: #BFEFF5; font-family: 'IBM Plex Mono', monospace; font-size: 11px">depth 0.6 m (probe)</span>
      <span style="padding: 4px 8px; border-radius: 7px; background: #15232A; font-family: 'IBM Plex Mono', monospace; font-size: 11px">case sealed</span>
      <span style="padding: 4px 8px; border-radius: 7px; background: #15232A; font-family: 'IBM Plex Mono', monospace; font-size: 11px">battery 54%</span>
    </div>
    <div style="display: flex; flex-direction: column; gap: 6px">
      <sc-for list="{{options}}" as="o" hint-placeholder-count="4">
        <div style="position: relative; height: 30px; border-radius: 8px; background: #12202A; border: {{o.border}}; overflow: hidden">
          <div style="position: absolute; left: 0; top: 0; bottom: 0; width: {{o.width}}; background: {{o.fill}}"></div>
          <div style="position: relative; height: 30px; display: flex; align-items: center; justify-content: space-between; padding: 0 10px; font-family: 'IBM Plex Mono', monospace; font-size: 12px; color: {{o.color}}"><span>{{o.label}}</span><span style="font-weight: 600">{{o.pct}}</span></div>
        </div>
      </sc-for>
    </div>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  renderVals() {
    var chosen = { border: '1px solid #3FD0E0', fill: 'rgba(63,208,224,0.35)', color: '#EDEFF2' };
    var other = { border: '1px solid #1C3540', fill: 'rgba(154,163,174,0.18)', color: '#C9CED6' };
    return {
      options: [
        Object.assign({ label: '▶ cruise', pct: '64%', width: '64%' }, chosen),
        Object.assign({ label: 'slow_down', pct: '22%', width: '22%' }, other),
        Object.assign({ label: 'accelerate', pct: '10%', width: '10%' }, other),
        Object.assign({ label: 'reverse', pct: '4%', width: '4%' }, other)
      ]
    };
  }
}
</script>
