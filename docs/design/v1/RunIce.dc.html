<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>RivetRun — Run: Frozen Pass with Scout Drone</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Chakra+Petch:wght@500;600;700&amp;family=IBM+Plex+Sans:wght@400;500;600&amp;family=IBM+Plex+Mono:wght@500;600&amp;display=swap">
<style>
body{margin:0}
a{color:#3FD0E0}a:hover{color:#8BE6F0}
</style>
</helmet>
<div style="position: relative; width: 390px; height: 844px; box-sizing: border-box; background: #0B111D; font-family: 'IBM Plex Sans', sans-serif; color: #EDEFF2; overflow: hidden">

  <svg viewBox="0 0 390 580" width="390" height="580" style="position: absolute; left: 0; top: 0" role="img" aria-label="Night ice pass: a wheeled robot climbs an icy slope while a small scout drone hovers ahead, scanning the ice with a cyan cone">
    <g fill="#C9D6E6"><circle cx="30" cy="130" r="1"></circle><circle cx="96" cy="160" r="1.2"></circle><circle cx="150" cy="128" r="0.9"></circle><circle cx="212" cy="170" r="1.1"></circle><circle cx="300" cy="140" r="1"></circle><circle cx="356" cy="176" r="1.3"></circle><circle cx="64" cy="200" r="0.9"></circle><circle cx="260" cy="206" r="1"></circle></g>
    <polygon points="0,330 70,250 130,310 210,230 290,300 350,250 390,280 390,580 0,580" fill="#111A2A"></polygon>
    <polygon points="70,250 86,268 58,266" fill="#C9D6E6"></polygon>
    <polygon points="210,230 228,252 194,250" fill="#C9D6E6"></polygon>
    <polygon points="350,250 364,266 338,264" fill="#C9D6E6"></polygon>
    <polygon points="0,380 120,350 230,372 390,340 390,580 0,580" fill="#152034"></polygon>

    <polygon points="0,480 70,480 250,430 390,428 390,580 0,580" fill="#3E6F8A"></polygon>
    <polygon points="0,480 70,480 70,580 0,580" fill="#24272D"></polygon>
    <polyline points="0,480 70,480" fill="none" stroke="#3A3E46" stroke-width="5"></polyline>
    <polyline points="70,480 250,430" fill="none" stroke="#BFE3F2" stroke-width="5"></polyline>
    <g stroke="#FFFFFF" stroke-width="2" stroke-linecap="round" opacity="0.55"><line x1="92" y1="483" x2="128" y2="473"></line><line x1="160" y1="466" x2="210" y2="452"></line><line x1="120" y1="490" x2="140" y2="484"></line></g>
    <polyline points="250,430 390,428" fill="none" stroke="#8C949E" stroke-width="5"></polyline>
    <polygon points="264,430 276,412 288,430" fill="#6B737D"></polygon>
    <polygon points="300,429 318,404 334,429" fill="#59606A"></polygon>
    <polygon points="346,428 360,410 374,428" fill="#6B737D"></polygon>

    <polygon points="268,262 218,448 330,432" fill="rgba(63,208,224,0.13)"></polygon>
    <line x1="268" y1="262" x2="218" y2="448" stroke="#3FD0E0" stroke-width="1" stroke-dasharray="3 4"></line>
    <line x1="268" y1="262" x2="330" y2="432" stroke="#3FD0E0" stroke-width="1" stroke-dasharray="3 4"></line>

    <g transform="translate(268,246)">
      <line x1="-30" y1="0" x2="30" y2="0" stroke="#5B6470" stroke-width="4"></line>
      <ellipse cx="-30" cy="-6" rx="17" ry="3" fill="#C9D6E6" opacity="0.7"></ellipse>
      <ellipse cx="30" cy="-6" rx="17" ry="3" fill="#C9D6E6" opacity="0.7"></ellipse>
      <rect x="-14" y="-6" width="28" height="14" rx="5" fill="#23272E" stroke="#3FD0E0" stroke-width="1.5"></rect>
      <circle cx="0" cy="13" r="5" fill="#141518" stroke="#4B6275" stroke-width="2"></circle>
      <circle cx="9" cy="-1" r="1.6" fill="#FF7A1A"></circle>
    </g>

    <g transform="translate(128,466) rotate(-15.5) scale(0.6) translate(-120,-140)">
      <rect x="52" y="44" width="110" height="16" rx="2" fill="#2E9D63"></rect>
      <rect x="166" y="28" width="42" height="17" rx="2" fill="#2F6FD6"></rect>
      <circle cx="177" cy="36.5" r="7" fill="#C9CED6"></circle><circle cx="197" cy="36.5" r="7" fill="#C9CED6"></circle>
      <rect x="34" y="60" width="170" height="36" rx="8" fill="#FF7A1A"></rect>
      <rect x="194" y="54" width="32" height="42" rx="7" fill="#121418" stroke="#2A2F37" stroke-width="2"></rect>
      <rect x="201" y="66" width="7" height="14" rx="3" fill="#3FD0E0"></rect><rect x="213" y="66" width="7" height="14" rx="3" fill="#3FD0E0"></rect>
      <circle cx="72" cy="114" r="27" fill="#17191D" stroke="#2C3038" stroke-width="7" stroke-dasharray="7 4"></circle><circle cx="72" cy="114" r="9" fill="#8A929C"></circle>
      <circle cx="168" cy="114" r="27" fill="#17191D" stroke="#2C3038" stroke-width="7" stroke-dasharray="7 4"></circle><circle cx="168" cy="114" r="9" fill="#8A929C"></circle>
    </g>

    <g fill="#FFFFFF" opacity="0.7"><circle cx="22" cy="80" r="1.6"></circle><circle cx="84" cy="230" r="1.4"></circle><circle cx="140" cy="60" r="1.8"></circle><circle cx="190" cy="300" r="1.4"></circle><circle cx="232" cy="110" r="1.6"></circle><circle cx="318" cy="340" r="1.5"></circle><circle cx="370" cy="96" r="1.8"></circle><circle cx="46" cy="380" r="1.4"></circle><circle cx="300" cy="200" r="1.3"></circle><circle cx="110" cy="410" r="1.5"></circle></g>
  </svg>

  <div style="position: absolute; left: 12px; right: 12px; top: 14px; padding: 10px 12px; border-radius: 14px; background: rgba(11,17,29,0.86); border: 1px solid #22304A; display: flex; align-items: center; justify-content: space-between">
    <span style="font-family: 'IBM Plex Mono', monospace; font-size: 22px; font-weight: 600">00:22.1</span>
    <div style="display: flex; gap: 12px">
      <div style="display: flex; flex-direction: column; gap: 3px; width: 82px">
        <span style="font-family: 'IBM Plex Mono', monospace; font-size: 9px; letter-spacing: 1px; color: #9AA3AE">BATTERY 64%</span>
        <div style="height: 6px; border-radius: 3px; background: #232932"><div style="width: 64%; height: 6px; border-radius: 3px; background: #3FD0E0"></div></div>
      </div>
      <div style="display: flex; flex-direction: column; gap: 3px; width: 82px">
        <span style="font-family: 'IBM Plex Mono', monospace; font-size: 9px; letter-spacing: 1px; color: #9AA3AE">DAMAGE 3%</span>
        <div style="height: 6px; border-radius: 3px; background: #232932"><div style="width: 3%; height: 6px; border-radius: 3px; background: #FF7A1A"></div></div>
      </div>
    </div>
  </div>

  <div style="position: absolute; left: 12px; top: 84px; padding: 5px 10px; border-radius: 8px; background: #2A170A; color: #FFB27A; font-family: 'IBM Plex Mono', monospace; font-size: 10px; letter-spacing: 1.5px">CONCEPT · SCOUT DRONE</div>
  <div style="position: absolute; left: 226px; top: 452px; padding: 5px 9px; border-radius: 8px; border: 1px solid #3FD0E0; background: rgba(8,24,27,0.9); font-family: 'IBM Plex Mono', monospace; font-size: 10px; color: #BFEFF5">ICE · μ 0.12 · 14 m</div>

  <div style="position: absolute; left: 0; right: 0; bottom: 0; height: 270px; box-sizing: border-box; background: #10151A; border-top: 2px solid #3FD0E0; border-radius: 22px 22px 0 0; padding: 14px 16px 16px; display: flex; flex-direction: column; gap: 10px">
    <div style="display: flex; align-items: center; justify-content: space-between">
      <span style="font-family: 'Chakra Petch', sans-serif; font-weight: 700; font-size: 16px; letter-spacing: 2px; color: #3FD0E0">BRAIN</span>
      <span style="font-family: 'IBM Plex Mono', monospace; font-size: 11px; color: #9AA3AE">JEV · 402 ms · trigger: drone</span>
    </div>
    <div style="display: flex; flex-wrap: wrap; gap: 6px">
      <span style="padding: 4px 8px; border-radius: 7px; border: 1px solid #1F5A63; background: #0C1A1D; color: #BFEFF5; font-family: 'IBM Plex Mono', monospace; font-size: 11px">ahead ICE (drone)</span>
      <span style="padding: 4px 8px; border-radius: 7px; background: #1A2027; font-family: 'IBM Plex Mono', monospace; font-size: 11px">in 14 m</span>
      <span style="padding: 4px 8px; border-radius: 7px; background: #1A2027; font-family: 'IBM Plex Mono', monospace; font-size: 11px">slope 12°</span>
      <span style="padding: 4px 8px; border-radius: 7px; background: #1A2027; font-family: 'IBM Plex Mono', monospace; font-size: 11px">slip 4%</span>
    </div>
    <div style="display: flex; flex-direction: column; gap: 6px">
      <sc-for list="{{options}}" as="o" hint-placeholder-count="4">
        <div style="position: relative; height: 30px; border-radius: 8px; background: #161C22; border: {{o.border}}; overflow: hidden">
          <div style="position: absolute; left: 0; top: 0; bottom: 0; width: {{o.width}}; background: {{o.fill}}"></div>
          <div style="position: relative; height: 30px; display: flex; align-items: center; justify-content: space-between; padding: 0 10px; font-family: 'IBM Plex Mono', monospace; font-size: 12px; color: {{o.color}}"><span>{{o.label}}</span><span style="font-weight: 600">{{o.pct}}</span></div>
        </div>
      </sc-for>
    </div>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  renderVals() {
    var chosen = { border: '1px solid #3FD0E0', fill: 'rgba(63,208,224,0.35)', color: '#EDEFF2' };
    var other = { border: '1px solid #232932', fill: 'rgba(154,163,174,0.18)', color: '#C9CED6' };
    return {
      options: [
        Object.assign({ label: '▶ slow_down', pct: '81%', width: '81%' }, chosen),
        Object.assign({ label: 'cruise', pct: '12%', width: '12%' }, other),
        Object.assign({ label: 'brake', pct: '5%', width: '5%' }, other),
        Object.assign({ label: 'accelerate', pct: '2%', width: '2%' }, other)
      ]
    };
  }
}
</script>
</body>
</html>
